<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد سيناريو الوثائقيات القصيرة</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background-color: #1e293b; padding: 24px; border-radius: 16px; max-width: 480px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; color: #38bdf8; margin-top: 0; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    textarea, select { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; padding: 14px; background-color: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:hover { background-color: #0369a1; }
    #result { margin-top: 20px; display: none; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
    .scene { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #334155; }
    .prompt { background: #1e293b; padding: 8px; border-radius: 4px; font-family: monospace; color: #f59e0b; font-size: 12px; margin-top: 5px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎬 مولد سيناريو الوثائقيات القصيرة</h2>
    <label>موضوع الفيديو الوثائقي:</label>
    <textarea id="topic" rows="3" placeholder="مثلاً: كائن بطيء المشية، سيارة تويوتا 70..."></textarea>
    
    <label>أسلوب التعليق الصوتي:</label>
    <select id="style">
      <option>🎬 غامض وثائقي وحماسي</option>
      <option>🌿 هادئ وطبيعي</option>
      <option>🔥 سيعرض بقوة وسرعة</option>
    </select>
    
    <button onclick="generateScript()">🚀 توليد السيناريو الآن</button>
    
    <div id="result">
      <h3>النتيجة التوليدية:</h3>
      <div id="output"></div>
    </div>
  </div>

  <script>
    function generateScript() {
      const topic = document.getElementById('topic').value.trim();
      if(!topic) { alert('يرجى كتابة موضوع أولاً!'); return; }
      
      const output = document.getElementById('output');
      document.getElementById('result').style.display = 'block';
      
      output.innerHTML = `
        <div class="scene">
          <strong>المشهد 1 (الافتتاحية):</strong>
          <p>عرض حماسي لجذب الانتباه مستوحى من: "${topic}".</p>
          <div class="prompt">Prompt: Cinematic dramatic opening shot of ${topic}, hyper-realistic, 8k resolution, documentary lighting --ar 9:16</div>
        </div>
        <div class="scene">
          <strong>المشهد 2 (التفاصيل):</strong>
          <p>التعليق الصوتي: في هذا العالم المتسارع، هناك أسرار لا تدركها العين المجردة...</p>
          <div class="prompt">Prompt: Detailed close-up shot explaining ${topic}, 4k, National Geographic style --ar 9:16</div>
        </div>
        <div class="scene">
          <strong>المشهد 3 (الخاتمة والدعوة للإجراء):</strong>
          <p>شاشة النهاية مع استعراض اسم الأداة والروابط التفاعلية.</p>
          <div class="prompt">Prompt: Epic final scene featuring ${topic} with textual call-to-action overlay --ar 9:16</div>
        </div>
      `;
    }
  </script>
</body>
</html>
